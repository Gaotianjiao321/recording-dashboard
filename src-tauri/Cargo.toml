[package]
name = "recording-dashboard"
version = "0.1.0"
description = "Mac personal work recording dashboard"
authors = ["Multica"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "recording_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

