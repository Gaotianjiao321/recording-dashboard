[package]
name = "recording-dashboard"
version = "0.1.3"
description = "Mac menu bar recording dashboard"
authors = ["Recording Dashboard"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "recording_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
once_cell = "1"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
