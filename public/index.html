<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作录音看板</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <header class="topbar" aria-label="看板顶部">
          <div>
            <p class="crumb">本地录音 / 今日工作流</p>
            <h1>工作录音看板</h1>
          </div>
          <div class="topbar-actions">
            <span id="last-updated" class="sync-chip">等待刷新</span>
            <button id="upload-recording" class="icon-btn secondary" type="button">开始录音</button>
            <button id="add-task" class="icon-btn secondary" type="button">手动记录</button>
            <button id="refresh" class="icon-btn" type="button" aria-label="刷新看板">刷新</button>
          </div>
        </header>

        <section class="kpi-grid" aria-label="今日关键指标">
          <article class="kpi-card">
            <span class="kpi-label">🎙 录音总数</span>
            <strong id="recordings">0</strong>
            <small>今日已进入系统的录音</small>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">⚡ 进行中</span>
            <strong id="processing">0</strong>
            <small>正在推进的个人任务</small>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">📋 待办任务数</span>
            <strong id="pending">0</strong>
            <small>待确认、进行中和已完成任务</small>
          </article>
        </section>

        <section class="filterbar" aria-label="看板筛选提示">
          <span class="filter-label">视图</span>
          <div class="chip-row" id="chip-row">
            <button class="chip active" data-filter="today" type="button">📅 今日</button>
            <button class="chip" data-filter="recordings" type="button">🎙 录音</button>
            <button class="chip" data-filter="tasks" type="button">📋 任务</button>
            <button class="chip" data-filter="decisions" type="button">💡 决策</button>
          </div>
          <div class="filter-spacer"></div>
          <label class="auto-refresh">
            <input id="auto-refresh" type="checkbox" checked />
            <span>自动刷新</span>
          </label>
          <span id="board-status" class="board-status">正在加载看板数据</span>
        </section>
        <p id="upload-status" class="upload-status" role="status">点击开始录音，停止后自动上传并解析。</p>

        <section class="board" aria-label="今日看板">
          <div class="column">
            <div class="column-head">
              <div class="column-name"><span class="swatch gray"></span>⏳ 待办</div>
              <span id="pending-count" class="column-count">0</span>
            </div>
            <div id="pending-column" class="card-stack"></div>
          </div>

          <div class="column">
            <div class="column-head">
              <div class="column-name"><span class="swatch violet"></span>🔄 进行中</div>
              <span id="processing-count" class="column-count">0</span>
            </div>
            <div id="processing-column" class="card-stack"></div>
          </div>

          <div class="column">
            <div class="column-head">
              <div class="column-name"><span class="swatch green"></span>✅ 已完成</div>
              <span id="done-count" class="column-count">0</span>
            </div>
            <div id="done-column" class="card-stack"></div>
          </div>
        </section>
      </main>

      <aside class="sidebar" aria-label="今日洞察">
        <section class="sidebar-block">
          <h2>📝 今日摘要</h2>
          <p id="summary" class="summary-text">暂无已处理录音。</p>
          <div class="pulse-bar" aria-hidden="true"><span id="completion-bar"></span></div>
        </section>

        <section class="sidebar-block">
          <h2>💡 决策</h2>
          <div id="decisions" class="insight-list"></div>
        </section>

        <section class="sidebar-block">
          <h2>❓ 待解决问题</h2>
          <div id="questions" class="insight-list"></div>
        </section>

        <section class="sidebar-block">
          <h2>🔔 通知</h2>
          <div id="notifications" class="notification-list"></div>
        </section>
      </aside>
    </div>

    <div id="task-modal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-label="手动记录待办">
        <div class="modal-header">
          <h3>手动记录待办</h3>
          <button id="modal-close" class="modal-close-btn" type="button" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body">
          <label for="task-input">待办内容</label>
          <textarea id="task-input" rows="3" placeholder="输入待办事项..."></textarea>
          <div class="task-fields">
            <label>
              优先级
              <select id="task-priority">
                <option value="medium">中</option>
                <option value="high">高</option>
                <option value="low">低</option>
              </select>
            </label>
            <label>
              截止日期
              <input id="task-due-date" type="date" />
            </label>
          </div>
          <label for="task-project">项目归属</label>
          <input id="task-project" type="text" placeholder="例如：工作看板" />
        </div>
        <div class="modal-footer">
          <button id="modal-cancel" class="icon-btn secondary" type="button">取消</button>
          <button id="modal-submit" class="icon-btn" type="button">添加</button>
        </div>
      </div>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
