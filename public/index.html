<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人工作雷达</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <header class="topbar" aria-label="看板顶部">
          <div>
            <p class="crumb">个人工作雷达 / 今日工作流</p>
            <h1>个人工作雷达</h1>
          </div>
          <div class="topbar-actions">
            <span id="last-updated" class="sync-chip">等待刷新</span>
            <button id="upload-recording" class="icon-btn secondary" type="button">开始录音</button>
            <button id="add-task" class="icon-btn secondary" type="button">手动记录</button>
            <button id="refresh" class="icon-btn" type="button" aria-label="刷新看板">刷新</button>
          </div>
        </header>

        <section class="kpi-grid" aria-label="今日关键指标">
          <article class="kpi-card">
            <span class="kpi-label">🎙 今日录音</span>
            <strong id="recordings">0</strong>
            <small>今日已录制的音频</small>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">⏳ 待确认</span>
            <strong id="pending">0</strong>
            <small>AI 识别待确认事项</small>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">📋 我的待办</span>
            <strong id="processing">0</strong>
            <small>已确认进行中的任务</small>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">🤝 等待别人</span>
            <strong id="waiting">0</strong>
            <small>需要他人回复的任务</small>
          </article>
        </section>

        <section class="filterbar" aria-label="看板筛选提示">
          <span class="filter-label">视图</span>
          <div class="chip-row" id="chip-row">
            <button class="chip active" data-filter="today" type="button">📋 行动看板</button>
            <button class="chip" data-filter="projects" type="button">🗂 项目</button>
          </div>
          <div class="filter-spacer"></div>
          <label class="auto-refresh">
            <input id="auto-refresh" type="checkbox" checked />
            <span>自动刷新</span>
          </label>
          <span id="board-status" class="board-status">正在加载看板数据</span>
        </section>
        <p id="upload-status" class="upload-status" role="status">点击开始录音，停止后自动上传并解析。</p>

        <section class="board" aria-label="今日看板">
          <div class="column">
            <div class="column-head">
              <div class="column-name"><span class="swatch orange"></span>⏳ 待确认</div>
              <span id="pending-count" class="column-count">0</span>
            </div>
            <div id="pending-column" class="card-stack"></div>
          </div>

          <div class="column">
            <div class="column-head">
              <div class="column-name"><span class="swatch violet"></span>🔄 进行中</div>
              <span id="processing-count" class="column-count">0</span>
            </div>
            <div id="processing-column" class="card-stack"></div>
          </div>

          <div class="column">
            <div class="column-head">
              <div class="column-name"><span class="swatch blue"></span>🤝 等待他人</div>
              <span id="waiting-count" class="column-count">0</span>
            </div>
            <div id="waiting-column" class="card-stack"></div>
          </div>
        </section>

        <section id="project-board" class="project-board" aria-label="项目视图" hidden></section>
      </main>

      <aside class="sidebar" aria-label="今日简报">
        <section class="sidebar-block">
          <h2>📝 今日摘要</h2>
          <p id="summary" class="summary-text">暂无已处理录音。</p>
        </section>

        <section class="sidebar-block">
          <h2>💡 关键决策</h2>
          <div id="decisions" class="insight-list"></div>
        </section>

        <section class="sidebar-block">
          <h2>❓ 开放问题</h2>
          <div id="questions" class="insight-list"></div>
        </section>

        <section class="sidebar-block">
          <h2>🎙 最近录音</h2>
          <div id="notifications" class="notification-list"></div>
        </section>
      </aside>
    </div>

    <div id="task-modal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-label="手动记录待办">
        <div class="modal-header">
          <h3 id="task-modal-title">手动记录待办</h3>
          <button id="modal-close" class="modal-close-btn" type="button" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body">
          <label for="task-title">标题</label>
          <input id="task-title" type="text" placeholder="输入标题..." />
          <label for="task-body">正文</label>
          <textarea id="task-body" rows="3" placeholder="补充背景、行动细节或备注..."></textarea>
          <div class="task-fields">
            <label>
              优先级
              <select id="task-priority">
                <option value="medium">中</option>
                <option value="high">高</option>
                <option value="low">低</option>
              </select>
            </label>
            <label>
              截止日期
              <input id="task-due-date" type="date" />
            </label>
          </div>
          <label for="task-project">项目归属</label>
          <div id="project-select-container" class="project-picker">
            <select id="task-project"></select>
            <button id="new-project" class="mini-btn" type="button">新建项目</button>
          </div>
          <div id="new-project-form" class="project-picker" hidden>
            <input id="new-project-input" type="text" placeholder="输入新项目名称" />
            <div style="display:flex;gap:8px;">
              <button id="new-project-submit" class="mini-btn" type="button">确定</button>
              <button id="new-project-cancel" class="mini-btn secondary" type="button">取消</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="modal-cancel" class="icon-btn secondary" type="button">取消</button>
          <button id="modal-submit" class="icon-btn" type="button">添加</button>
        </div>
      </div>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
